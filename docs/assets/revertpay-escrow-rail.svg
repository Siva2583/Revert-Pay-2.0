<svg xmlns="http://www.w3.org/2000/svg" width="880" height="168" viewBox="0 0 880 168" fill="none" role="img" aria-labelledby="title description">
  <title id="title">RevertPay escrow rail</title>
  <desc id="description">A decorative animated pulse moves through four escrow milestones: initiated, funded, shipped, and released.</desc>
  <defs>
    <linearGradient id="panel" x1="32" y1="12" x2="848" y2="156" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101813"/>
      <stop offset="0.55" stop-color="#080B09"/>
      <stop offset="1" stop-color="#17130D"/>
    </linearGradient>
    <linearGradient id="rail" x1="90" y1="82" x2="790" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00C853"/>
      <stop offset="0.55" stop-color="#4D8C68"/>
      <stop offset="1" stop-color="#C6A15B"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="0" cy="0" r="1" gradientTransform="translate(90 82) rotate(90) scale(100 240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00C853" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00C853" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientTransform="translate(790 82) rotate(90) scale(100 240)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C6A15B" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#B8C7BC" stroke-opacity="0.035"/>
    </pattern>
    <filter id="pulseGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .motion { display: inline; }
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="878" height="166" rx="25" fill="url(#panel)" stroke="#2A3A30"/>
  <rect x="1" y="1" width="878" height="166" rx="25" fill="url(#grid)"/>
  <rect width="880" height="168" rx="26" fill="url(#emeraldGlow)"/>
  <rect width="880" height="168" rx="26" fill="url(#goldGlow)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="38" y="35" fill="#C6A15B" font-size="11" font-weight="600" letter-spacing="2.6">REVERTPAY / ESCROW RAIL</text>
    <text x="842" y="35" text-anchor="end" fill="#8FA298" font-size="10" letter-spacing="1.8">PROTECTED AT EVERY STEP</text>

    <path d="M90 82H790" stroke="#26372D" stroke-width="4" stroke-linecap="round"/>
    <g class="motion">
      <path d="M90 82H790" stroke="url(#rail)" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 12" opacity="0.9">
        <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>

    <g fill="#0B100D" stroke-width="2">
      <circle cx="90" cy="82" r="12" stroke="#00C853"/>
      <circle cx="323" cy="82" r="12" stroke="#3C9C67"/>
      <circle cx="557" cy="82" r="12" stroke="#829464"/>
      <circle cx="790" cy="82" r="12" stroke="#C6A15B"/>
    </g>
    <g fill="#DDE8E0">
      <circle cx="90" cy="82" r="3"/>
      <circle cx="323" cy="82" r="3"/>
      <circle cx="557" cy="82" r="3"/>
      <circle cx="790" cy="82" r="3"/>
    </g>

    <g class="motion" filter="url(#pulseGlow)">
      <circle r="5" fill="#F2C96D">
        <animateMotion path="M90 82H790" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
      </circle>
    </g>
    <g class="still">
      <circle cx="90" cy="82" r="5" fill="#00C853"/>
    </g>

    <g text-anchor="middle">
      <text x="90" y="121" fill="#F1F5F2" font-size="12" font-weight="700" letter-spacing="1.4">INITIATED</text>
      <text x="323" y="121" fill="#F1F5F2" font-size="12" font-weight="700" letter-spacing="1.4">FUNDED</text>
      <text x="557" y="121" fill="#F1F5F2" font-size="12" font-weight="700" letter-spacing="1.4">SHIPPED</text>
      <text x="790" y="121" fill="#F1F5F2" font-size="12" font-weight="700" letter-spacing="1.4">RELEASED</text>
      <text x="90" y="141" fill="#71877A" font-size="9" letter-spacing="1.2">01 / REQUEST</text>
      <text x="323" y="141" fill="#71877A" font-size="9" letter-spacing="1.2">02 / PROTECT</text>
      <text x="557" y="141" fill="#71877A" font-size="9" letter-spacing="1.2">03 / FULFIL</text>
      <text x="790" y="141" fill="#71877A" font-size="9" letter-spacing="1.2">04 / SETTLE</text>
    </g>
  </g>
</svg>
